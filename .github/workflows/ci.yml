name: Tests

# En cada pull request: los mismos tests y build que el despliegue, pero sin
# publicar nada. Así un PR roto se ve antes de fusionarlo en main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
